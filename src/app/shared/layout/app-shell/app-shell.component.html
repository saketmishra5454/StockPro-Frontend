<div class="shell">
  <aside class="sidebar glass-panel" [class.sidebar--collapsed]="collapsed()">
    <div class="brand">
      <div class="brand__mark">S</div>
      <div class="brand__copy" *ngIf="!collapsed()">
        <strong>StockPro</strong>
        <span>Inventory OS</span>
      </div>
    </div>

    <nav class="nav-list" aria-label="Primary navigation">
      <a
        *ngFor="let item of visibleNavigation()"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
        [attr.aria-label]="item.label"
      >
        <mat-icon fontSet="material-icons-round">{{ item.icon }}</mat-icon>
        <span *ngIf="!collapsed()">{{ item.label }}</span>
      </a>
    </nav>
  </aside>

  <section class="workspace">
    <header class="topbar glass-panel">
      <div class="topbar__left">
        <button mat-icon-button type="button" aria-label="Toggle sidebar" (click)="toggleSidebar()">
          <mat-icon fontSet="material-icons-round">menu_open</mat-icon>
        </button>

        <div class="search">
          <mat-icon fontSet="material-icons-round">search</mat-icon>
          <input
            type="search"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            (keydown.enter)="runSearch()"
            [matMenuTriggerFor]="searchMenu"
            placeholder="Search inventory, suppliers, orders"
            aria-label="Search StockPro"
          >
        </div>
        <mat-menu #searchMenu="matMenu" panelClass="search-menu">
          <button *ngFor="let item of searchMatches()" mat-menu-item type="button" (click)="openSearchMatch(item.route)">
            <mat-icon fontSet="material-icons-round">{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
          <button *ngIf="searchQuery().trim() && !searchMatches().length" mat-menu-item type="button" (click)="runSearch()">
            <mat-icon fontSet="material-icons-round">inventory_2</mat-icon>
            <span>Search products for "{{ searchQuery().trim() }}"</span>
          </button>
        </mat-menu>
      </div>

      <div class="topbar__actions">
        <button class="topbar__icon-button" mat-icon-button type="button" aria-label="Toggle theme" (click)="theme.toggle()">
          <mat-icon fontSet="material-icons-round">{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>

        <button
          class="topbar__icon-button notification-button"
          mat-icon-button
          type="button"
          aria-label="Notifications"
          [matMenuTriggerFor]="notificationMenu"
          (menuOpened)="loadAlerts()"
        >
          <mat-icon fontSet="material-icons-round">notifications</mat-icon>
          <span *ngIf="unreadAlerts().length" aria-hidden="true">{{ unreadAlerts().length > 9 ? '9+' : unreadAlerts().length }}</span>
        </button>
        <mat-menu #notificationMenu="matMenu" panelClass="notification-menu">
          <div class="notification-menu__header" (click)="$event.stopPropagation()">
            <strong>Notifications</strong>
            <small>{{ unreadAlerts().length }} unread</small>
          </div>
          <button *ngFor="let alert of alertPreview()" mat-menu-item type="button" (click)="openAlerts()">
            <mat-icon fontSet="material-icons-round">{{ alert.severity === 'CRITICAL' ? 'priority_high' : alert.severity === 'WARNING' ? 'warning' : 'info' }}</mat-icon>
            <span>
              <strong>{{ alert.title }}</strong>
              <small>{{ alert.message || alert.type }}</small>
            </span>
          </button>
          <button *ngIf="!alertPreview().length" mat-menu-item type="button" (click)="openAlerts()">
            <mat-icon fontSet="material-icons-round">notifications_none</mat-icon>
            <span>No notifications</span>
          </button>
          <button mat-menu-item type="button" (click)="markAllAlertsRead()" [disabled]="!unreadAlerts().length">
            <mat-icon fontSet="material-icons-round">done_all</mat-icon>
            <span>Mark all read</span>
          </button>
          <button mat-menu-item type="button" (click)="openAlerts()">
            <mat-icon fontSet="material-icons-round">open_in_new</mat-icon>
            <span>Open alert centre</span>
          </button>
        </mat-menu>

        <ng-container *ngIf="user$ | async as user">
          <button mat-button type="button" [matMenuTriggerFor]="profileMenu" class="profile-button">
            <span class="profile-button__avatar">{{ user.name.charAt(0) | uppercase }}</span>
            <span class="profile-button__copy">
              <strong>{{ user.name }}</strong>
              <small>ID {{ user.id }}</small>
            </span>
            <span class="profile-button__role">{{ user.role }}</span>
            <mat-icon fontSet="material-icons-round">expand_more</mat-icon>
          </button>

          <mat-menu #profileMenu="matMenu" panelClass="profile-menu">
            <button mat-menu-item disabled>
              <mat-icon fontSet="material-icons-round">alternate_email</mat-icon>
              <span>{{ user.email }}</span>
            </button>
            <button mat-menu-item disabled>
              <mat-icon fontSet="material-icons-round">badge</mat-icon>
              <span>{{ user.role }}</span>
            </button>
            <button mat-menu-item type="button" (click)="logout()">
              <mat-icon fontSet="material-icons-round">logout</mat-icon>
              <span>Sign out</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>
