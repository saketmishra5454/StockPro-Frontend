<main class="grid min-h-screen place-items-center px-4 py-10">
  <section class="glass-panel w-full max-w-lg rounded-3xl p-8">
    <div class="mb-8">
      <p class="text-sm font-semibold text-brand-600">StockPro</p>
      <h1 class="mt-2 text-3xl font-bold text-[var(--app-text)]">Create your account</h1>
      <p class="mt-2 text-sm text-[var(--app-muted)]">Start with a role-aware inventory workspace for your operations team.</p>
    </div>

    <form class="grid gap-4" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" autocomplete="name">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="new-password">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option *ngFor="let role of roles" [value]="role">{{ role }}</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="primary" class="!h-12" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-[var(--app-muted)]">
      Already have an account?
      <a class="font-semibold text-brand-600" routerLink="/auth/login">Sign in</a>
    </p>
  </section>
</main>
