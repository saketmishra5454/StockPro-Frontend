<main class="reset-page">
  <section class="reset-card glass-panel">
    <div class="brand-lockup">
      <div class="brand-mark">S</div>
      <div>
        <strong>StockPro</strong>
        <span>Password recovery</span>
      </div>
    </div>

    <div class="reset-card__heading">
      <p>Secure reset</p>
      <h1>Create a new password</h1>
      <span>Your reset link expires after 30 minutes.</span>
    </div>

    <div *ngIf="!token" class="invalid-link">
      <mat-icon fontSet="material-icons-round">link_off</mat-icon>
      <p>This reset link is missing a token. Request a new password reset email.</p>
      <a mat-flat-button color="primary" routerLink="/auth/login">Back to login</a>
    </div>

    <form *ngIf="token" class="reset-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>New password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="new-password">
        <button
          mat-icon-button
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
          (click)="togglePasswordVisibility()"
        >
          <mat-icon fontSet="material-icons-round">{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error>{{ passwordError }}</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirm password</mat-label>
        <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="confirmPassword" autocomplete="new-password">
        <mat-icon matSuffix fontSet="material-icons-round">lock</mat-icon>
        <mat-error>{{ confirmPasswordError }}</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" class="!h-12 !rounded-xl" type="submit" [disabled]="loading()">
        <span class="inline-flex items-center gap-2">
          <mat-spinner *ngIf="loading()" diameter="18"></mat-spinner>
          {{ loading() ? 'Updating...' : 'Reset password' }}
        </span>
      </button>
    </form>
  </section>
</main>
